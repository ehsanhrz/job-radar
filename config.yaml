# ─────────────────────────────────────────────────────────────
#  Job Radar config. Secrets go in .env, everything else here.
#  After editing filters/scoring:  python -m jobradar rescore
#  All patterns are case-insensitive Python regexes. Use 'single quotes'.
# ─────────────────────────────────────────────────────────────

schedule:            # only used by `loop` (docker / VPS mode)
  interval_hours: 6
  jitter_minutes: 40

scrape:
  hours_old: 72              # only postings from the last N hours
  results_per_call: 20       # per site / target / search term
  fetch_description: true    # needed for good filtering (slower on LinkedIn)
  delay_between_calls_sec: [4, 10]   # random pause between requests, be polite
  # LinkedIn: search pages first, then job pages one by one, only for NEW jobs
  # whose title passes the filters. Hammering job pages is what triggers 429s.
  linkedin_max_details: 40
  linkedin_detail_delay_sec: [6, 12]

# Default search terms for every target (LinkedIn + Indeed understand OR / quotes)
search_terms:
  - '".NET" OR "C#"'
  - '"backend developer" OR "backend engineer"'
  - '"fintech" backend'
  - '"integration engineer" OR "solutions engineer"'

# Where to look. sites: linkedin | indeed | glassdoor | bayt (removed: 403 from the server)
# location         -> used by LinkedIn / Bayt
# country_indeed   -> required for Indeed/Glassdoor (turkey, uae, oman, germany, netherlands, ...)
targets:
  # LinkedIn usually rate-limits after a few searches and is then skipped for the
  # rest of the run, so the most valuable target goes FIRST.
  - name: Worldwide (remote)
    sites: [linkedin]
    location: 'Worldwide'
    is_remote: true
    extra_search_terms:
      - 'NestJS'

  - name: Turkey
    sites: [linkedin, indeed]
    location: 'Türkiye'
    country_indeed: turkey
    extra_search_terms:
      - 'C# yazılım geliştirici'
      - 'fintech yazılım'
      - 'NestJS'

  - name: UAE
    sites: [linkedin, indeed]
    location: 'United Arab Emirates'
    country_indeed: uae
    extra_search_terms:
      - 'fintech .NET'

  - name: Iraq
    sites: [linkedin]
    location: 'Iraq'

  - name: Oman
    sites: [linkedin, indeed]
    location: 'Oman'
    country_indeed: oman

  - name: Germany (remote)
    sites: [linkedin, indeed]
    location: 'Germany'
    country_indeed: germany
    is_remote: true

  - name: Netherlands (remote)
    sites: [linkedin, indeed]
    location: 'Netherlands'
    country_indeed: netherlands
    is_remote: true

extra_sources:
  arbeitnow:          # free official API, Germany/EU/remote
    enabled: true
    pages: 3
  kariyer:            # Kariyer.net (Turkey). Work model is on the card -> on-site/hybrid skipped early
    enabled: false        # off: applying needs a Turkish phone verification
    impersonate: chrome   # 403 for Python's TLS fingerprint, 200 for Chrome's (tested from the server)
    list_urls:
      - 'https://www.kariyer.net/is-ilanlari/remote?kw=.net'
      - 'https://www.kariyer.net/is-ilanlari/remote?kw=asp.net'   # 'c%23' made Kariyer return every remote job
      - 'https://www.kariyer.net/is-ilanlari/remote?kw=backend'
      - 'https://www.kariyer.net/is-ilanlari?kw=.net'
    max_details: 20
    detail_delay_sec: [3, 7]
  jaabz:              # international tech jobs; only the "Remote" tag matters to you
    enabled: true
    list_urls:
      - 'https://jaabz.com/jobs?keyword=.net&remote=1'
      - 'https://jaabz.com/jobs?keyword=c%23&remote=1'
      - 'https://jaabz.com/jobs?keyword=backend&remote=1'
      - 'https://jaabz.com/jobs/remote'
    max_details: 20
    detail_delay_sec: [3, 7]
  feeds:              # free official feeds, no keys, no anti-bot
    enabled: true
    hn: true            # Hacker News "Who is hiring?" (monthly thread, apply by email / company site)
    remoteok: true      # remoteok.com/api, latest ~100 remote jobs
    wwr_rss:            # We Work Remotely category feeds
      - 'https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss'
      - 'https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss'
  remote_boards:      # remote-only boards with free official APIs
    enabled: true
    boards: [himalayas, jobicy, remotive]
    search_terms: ['.net', 'backend']   # 'c#' -> HTTP 400 on Jobicy
    pages: 1

# ── Hard filters: a match = job is dropped (stored as 'filtered', see `stats`) ──
filters:
  max_age_days: 14

  # You can't relocate: on these boards the remote flag is reliable, so
  # remote == false means on-site/hybrid -> dropped.
  require_remote_sites: [arbeitnow, himalayas, jobicy, remotive, kariyer, jaabz, hn, remoteok, wwr,
                         greenhouse, lever, ashby, workable]

  # Applying on Indeed needs a phone verification you can't pass: keep only Indeed
  # postings that link to the company's own career site (the card opens that link).
  direct_apply_only_sites: [indeed]

  # title must match at least one of these
  title_include:
    - '(?<![a-z])\.net\b|dotnet|c#|csharp|asp\.?net'   # not the .Net in Kariyer.Net
    - 'back.?end|nest\.?js|node\.?js|full.?stack'
    - 'software (engineer|developer)|yaz[ıi]l[ıi]m|geli[şs]tirici'
    - '(integration|solutions?|implementation) (engineer|developer|specialist|architect)|technical solutions'

  title_exclude:
    - '\b(intern|internship|stajyer|trainee|graduate)\b'
    - 'yard[ıi]mc[ıi]|yeni mezun|\bstaj'      # Turkish: assistant / new graduate / internship
    - '\b(junior|jr)\b'
    - '\b(director|head of|vp|manager)\b'
    - '\b(ios|android|flutter|mobile)\b'
    - '\b(qa|tester|test automation|sdet)\b'
    - '\b(sap|salesforce|abap)\b'
    # other stacks, unless the title also mentions something we want
    - '^(?!.*((?<![a-z])\.net|c#|nest|node|full.?stack)).*\b(java|php|ruby|golang|scala|kotlin|rust|python|django|laravel)\b'
    - '^(?!.*(\.net|c#)).*(\(go\)|\bgo (developer|engineer)\b)'
    - '^(?!.*(\.net|c#|full|back)).*\b(front.?end|react|angular|vue)\b'

  # remote boards put their restriction in the location as "Remote: <where>".
  # Drop specific-country/region restrictions that don't include somewhere you could qualify.
  location_exclude:
    - '^remote: (?!.*(worldwide|anywhere|global|emea|middle east|mena|asia|turkey|t[üu]rkiye|iran|europe|cet|gmt|utc)).+'

  # anywhere in title/description: impossible from Iran
  hard_exclude:
    - 'authori[sz]ed to work in the (us|u\.s\.|united states|uk|united kingdom|eu)'
    - '(must|required to) be (a )?(us|u\.s\.) citizen'
    - '(security|active|secret) clearance'
    - 'green card'
    - '\bw-?2 only\b'
    - 'must (be )?(reside|located|based|live|living) in (the )?(us|usa|u\.s\.|united states|uk|united kingdom|canada|eu|europe|european union)'
    - 'right to work in (the )?(uk|united kingdom|eu|germany|netherlands)'
    - '(eu|european) work permit'
    - '(sanctioned|embargoed) countr'

# ── Scoring: higher = better. Sent to Telegram when score >= min_score ──
scoring:
  min_score: 30

  title_keywords:
    '(?<![a-z])\.net\b|dotnet|asp\.?net': 30
    'c#|csharp': 20
    'nest\.?js': 15
    '\b(senior|sr)\b|k[ıi]demli': 10
    'back.?end': 10
    '(integration|solutions?) (engineer|specialist|architect)|technical solutions': 10
    'fintech|payments?|trading|wallet|exchange': 5

  text_keywords:
    '(?<![a-z])\.net\b|c#': 10
    '\.net core|\.net ([5-9]|1[0-9])|asp\.net core': 10
    'entity framework|ef core': 5
    'sql server|mssql|t-sql': 5
    'postgres': 5
    'mongo': 5
    'microservice': 5
    'docker|kubernetes|k8s': 5
    'rabbitmq|kafka|redis': 5
    'integration': 3
    # your domain (CV): fintech / trading / wallets / KYC. Kept moderate on purpose:
    # fintech & crypto employers are the strictest on sanctions screening.
    '\bfintech\b|financial technology|payment (gateway|provider|processing)': 15
    'trading (system|platform|engine)|exchange|brokerage|order (book|matching)': 15
    '\bwallets?\b|\bkyc\b|\baml\b|identity verification|onboarding provider': 15
    # architecture you list on the CV
    '\bddd\b|domain.driven': 8
    '\bcqrs\b|event sourcing': 8
    'clean architecture|hexagonal|onion architecture': 8
    'event.driven|distributed systems?': 8
    'mediatr': 5
    'opentelemetry|prometheus|grafana|observability': 5
    'traefik|pgbouncer|docker swarm': 3
    'testcontainers|integration tests?': 3
    'nest\.?js|typescript': 5
    'legacy|moderni[sz]': 5
    'worldwide|anywhere in the world|work from anywhere|any (country|location)|fully remote': 15
    '\b(b2b|contractor|freelance)\b': 5

  penalties:
    'no (visa )?sponsorship|(not|unable to) (offer|provide) (visa )?sponsorship': -10
    'fluent (in )?german|german \(?(b2|c1|c2)|deutschkenntnisse|flie[ßs]end(e)? deutsch': -25
    'fluent (in )?dutch|dutch speaking': -25
    '(german|french|italian|dutch|spanish|polish)[- ]speaking|english and (german|french|italian|dutch|spanish)|\b(cdi|cdd)\b': -25
    'fluent (in )?arabic|arabic (speaker|speaking)': -15
    '\b(on-?site|in-?office|office-based)\b': -15   # you can't relocate right now
    '\bhybrid\b': -10
    # Turkish on-site / hybrid wording
    'ofisten [çc]al[ıi][şs]|ofiste [çc]al[ıi][şs]|y[üu]z y[üu]ze [çc]al[ıi][şs]|i[şs]yerinde': -15
    '\bhibrit\b': -10

  remote_bonus: 10      # is_remote flag or "remote"/"uzaktan" in text
  not_remote_penalty: -15   # no remote flag and the word "remote" appears nowhere
  turkish_bonus: 20     # posting written in Turkish -> your edge
  # posting WRITTEN in German / Dutch / French (not just "German is a plus"),
  # unless it says the working language is English
  foreign_language_penalty: -25
  fresh_bonus: 5        # posted in the last 2 days
  target_bonus:
    Turkey: 10

# ── Company ATS watcher ──
# Job links like boards.greenhouse.io/<co>, jobs.lever.co/<co>, jobs.ashbyhq.com/<co>,
# apply.workable.com/<co> reveal a company's own hiring board. Those companies are
# saved automatically and their boards are checked directly every run (public APIs,
# no keys). You apply on the company's site: email + CV, no phone verification.
ats:
  enabled: true
  discover: true
  max_companies_per_run: 40    # least recently checked first; bounds the run time
  delay_sec: [1, 3]
  disable_after_failures: 3    # board gone / slug wrong -> stop checking it
  skip_us_companies: true      # >=80% of a board's postings in the US -> skipped (sanctions)

# ── Optional AI second opinion (needs AI_BASE_URL / AI_API_KEY / AI_MODEL in env) ──
# Only reviews jobs that passed the keyword filter. ANY AI error -> keyword score is used.
ai:
  enabled: true
  weight: 5                    # final = keyword_score + (fit - 5) * weight   (fit 0-10)
  veto_infeasible: true        # AI says "not possible from Iran" -> dropped
  veto_fit_at_or_below: 2      # AI fit 0-2 -> dropped
  review_margin: 0             # 0 = only jobs that already passed min_score (highest first)
  # Sized for Groq free tier (gpt-oss-120b: 8K tokens/min, 200K tokens/day).
  # One review ~1.5K tokens -> ~5/min max, ~120/day.
  max_reviews_per_run: 15     # highest keyword scores first
  min_seconds_between_calls: 15
  description_chars: 3000
  max_tokens: 1500             # reasoning models "think" inside this budget too
  # Provider-specific request fields. These are for Groq + gpt-oss: low reasoning
  # (fast, cheap) and JSON mode. If a provider rejects them (HTTP 400) they're
  # dropped automatically for the run. Use {} for other providers if you like.
  extra_params:
    reasoning_effort: low
    include_reasoning: false
    response_format: {type: json_object}
  timeout_sec: 45
  max_consecutive_failures: 3  # then AI is switched off for the rest of the run

telegram:
  max_per_run: 20         # the rest stay queued for the next run
  send_run_summary: true

watchdog:
  zero_runs_alert: 3      # alert if a source returns 0 jobs N runs in a row
